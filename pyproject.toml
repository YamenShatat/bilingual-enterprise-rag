[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-enterprise-rag"
version = "0.1.0"
description = "Bilingual (Arabic/English) enterprise RAG platform with hybrid retrieval, reranking, evaluation and access control."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yamen Shatat" }]
# Runtime dependencies are added only when a feature needs them.
dependencies = [
    # PDF text extraction (PDFium). Chosen over pypdf/pdfminer.six/PyMuPDF; see docs/decisions.md.
    "pypdfium2>=5,<6",
    # PostgreSQL driver (libpq bundled by the binary extra). LGPL-3.0, used unmodified as an
    # installed library. No ORM on purpose; see docs/decisions.md.
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Not needed to run the application. Tokenizes text with a model's exact vocabulary, to measure
# (never to split) how many chunks would be truncated by a candidate embedding model; see
# docs/decisions.md D-006 and scripts/measure_chunk_tokens.py. Apache-2.0, maintained by
# Hugging Face, no runtime dependency could do this (it needs each model's own vocabulary file).
research = [
    "tokenizers>=0.20,<0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The SQL migrations ship inside the package so an installed copy can still migrate.
"bilingual_rag.database" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers as `from support.arabic import ...`.
pythonpath = ["tests"]
markers = [
    "database: needs a reachable PostgreSQL (skipped when it is down; run `docker compose up -d --wait db`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]
