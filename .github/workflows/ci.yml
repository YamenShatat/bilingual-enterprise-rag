# Lint and the fast test suite, on every push to main and every pull request.
#
# The `slow` tests (real embedding models, the reranker, Ollama) are not run here: they need
# gigabytes of weights and a GPU. Run them locally with `pytest --slow`.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        # Same image as docker-compose.yml.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: rag
          # A throwaway container that lives only for this job: not a secret.
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: rag
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      # Database tests fail instead of silently skipping when the database is unreachable.
      RAG_REQUIRE_DATABASE: "1"
      # No model may be downloaded: a fast test that tries fails instead of fetching gigabytes.
      HF_HUB_OFFLINE: "1"

    steps:
      # Actions pinned by commit, not by a tag that can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # CPU-only torch first (about 190 MB); from PyPI, pip would pull the CUDA build and its
        # NVIDIA libraries (several GB) that the fast suite never uses.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,embeddings,api,ui]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q -p no:warnings
